global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: generator
    static_configs: [{ targets: ["host.docker.internal:2112"] }]
  - job_name: ingester
    static_configs: [{ targets: ["host.docker.internal:2113"] }]
  - job_name: kafka-exporter
    static_configs: [{ targets: ["kafka-exporter:9308"] }]