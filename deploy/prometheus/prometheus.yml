global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: generator
    static_configs: [{ targets: ["generator:2112"] }]

  - job_name: ingester
    dns_sd_configs:
      - names: ["ingester"]
        type: A
        port: 2113
        refresh_interval: 10s

  - job_name: report-api
    static_configs: [{ targets: ["report-api:8080"] }]

  - job_name: kafka-exporter
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
